name: Bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f README.md
          test -f .gitignore
          test -f docs/product/vision.md
          test -f docs/architecture/data-contract.md
          test -f docs/architecture/system.md
